<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }

      @media print {
        * {
          box-shadow: none;
          text-shadow: none;
        }
        html,
        body {
          background: #fff;
        }
        @page {
          size: 960pt 540pt;
          margin: 0;
        }
        section.page {
          page-break-after: always;
          break-after: page;
          page-break-inside: avoid;
          break-inside: avoid;
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
      }
    </style>
  </head>
  <body></body>
</html>
